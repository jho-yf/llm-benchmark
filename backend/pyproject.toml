[project]
name = "llm-benchmark"
version = "0.1.0"
description = "LLM Benchmark testing tool"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",
    "sqlalchemy[asyncio]==2.0.49",
    "aiosqlite==0.22.1",
    "APScheduler==3.11.2",
    "openai==2.36.0",
    "lm-eval==0.4.12",
    "cryptography==48.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
