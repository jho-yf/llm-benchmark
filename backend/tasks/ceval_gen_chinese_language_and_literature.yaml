task: ceval_gen_chinese_language_and_literature
dataset_path: ceval/ceval-exam
dataset_name: chinese_language_and_literature
output_type: generate_until
test_split: test
validation_split: val
fewshot_split: dev
fewshot_config:
  sampler: first_n
doc_to_text: "{{question.strip()}}\nA. {{A}}\nB. {{B}}\nC. {{C}}\nD. {{D}}\n答案："
doc_to_target: "{{answer}}"
generation_kwargs:
  until:
    - "</s>"
    - "\n"
  do_sample: false
  temperature: 0.0
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
filter_list:
  - name: get_response
    filter:
      - function: "regex"
        regex_pattern: "^(.*?)(?=\n|$)"
      - function: remove_whitespace
      - function: take_first
metadata:
  version: 1.0
