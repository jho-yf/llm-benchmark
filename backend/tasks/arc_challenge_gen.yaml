task: arc_challenge_gen
dataset_path: allenai/ai2_arc
dataset_name: ARC-Challenge
output_type: generate_until
test_split: test
fewshot_split: train
fewshot_config:
  sampler: first_n
doc_to_text: "Question: {{question}}\n{% set letters = ['A','B','C','D','E','F','G','H'] %}{% for i in range(choices.text | length) %}{{ letters[i] }}. {{ choices.text[i] }}\n{% endfor %}Answer:"
doc_to_target: "{{answerKey}}"
generation_kwargs:
  until:
    - "</s>"
    - "\n"
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_punctuation: true
    ignore_case: true
filter_list:
  - name: get_response
    filter:
      - function: "regex"
        regex_pattern: "^(.*?)(?=\\n|$)"
      - function: remove_whitespace
      - function: take_first
metadata:
  version: 1.0
