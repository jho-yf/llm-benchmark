apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-benchmark
  labels:
    app: llm-benchmark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-benchmark
  template:
    metadata:
      labels:
        app: llm-benchmark
    spec:
      containers:
        - name: llm-benchmark
          image: llm-benchmark:latest
          ports:
            - containerPort: 8080
          env:
            - name: TZ
              value: "Asia/Shanghai"
